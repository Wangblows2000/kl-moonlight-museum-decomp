name: CI

on:
  push:
  pull_request:

jobs:
  source:
    # The commercial ROM and gamedata/ are never available in CI.  These jobs prove that the
    # committed source assembles to the exact original code bank and footer (hash-checked),
    # that the encoding macros, codecs and compressor work, and that no ROM-derived data is
    # tracked.  ROM/gamedata-dependent tests are reported as skipped, not passed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NASM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Python packages
        run: python -m pip install --upgrade pytest capstone pillow
      - name: Versions
        run: |
          nasm -v
          python --version
      - name: Guard - no ROM or extracted data committed
        run: python tools/check_repo_hygiene.py
      - name: Missing gamedata gives a clear error
        shell: bash
        run: |
          if python build.py > out.txt 2>&1; then echo "build unexpectedly succeeded"; exit 1; fi
          cat out.txt
          grep -q "python build.py extract" out.txt
      - name: Test suite (ROM / gamedata / emulator tests skip)
        run: python -m pytest -q -rs tests
